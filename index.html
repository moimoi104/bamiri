<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D2029">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="バミリ">
<meta name="description" content="シーンごとに音源をつけて、ダンスのフォーメーションを作るアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>バミリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single screen — top bar, stage, tool row, play bar, scene cards strip; sheets slide up from the bottom */
:root{
  --bg:#E8EBF1; --panel:#FFFFFF; --panel2:#F3F5F9; --ink:#141821; --muted:#5B6474; --line:#D2D7E1;
  --accent:#2B54DE; --accent-ink:#FFFFFF; --accent-soft:#DDE5FC;
  --floor:#1D2029; --wing:#14161C; --floor-g1:rgba(255,255,255,.05); --floor-g2:rgba(255,255,255,.13);
  --floor-text:#8F97A9; --tape:#F2C230; --tape2:#EF5F7A; --danger:#C93636; --ok:#18905F;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 6px 20px rgba(20,24,33,.08);
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101218; --panel:#181B23; --panel2:#1F232D; --ink:#E7EAF1; --muted:#98A0B1; --line:#2B303C;
  --accent:#7390FF; --accent-ink:#0B1020; --accent-soft:#232C4D; --floor:#171A22; --wing:#0D0F14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto}
#app>*{min-width:0}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.pname{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:700;font-size:16px}
.pname:focus{border-color:var(--line);background:var(--panel2);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:0;background:transparent;padding:0;flex:none}
.ib:hover{background:var(--panel2)}
.ib:disabled{opacity:.3}
.ib svg{width:20px;height:20px}
.ib .lb{font-size:9px;display:block;line-height:1}

.stage-area{position:relative;min-height:0;background:var(--wing)}
#stage{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{position:absolute;left:10px;right:10px;top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none;color:#E9ECF3}
.hud .nm{font-weight:700;font-size:15px;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:7px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .inf{font-size:12px;color:#C3C9D6;padding:6px 0;flex:1;min-width:0}
.hud .btn{pointer-events:auto;color:var(--ink)}
body:not(.practice) .exitp{display:none}
body.practice .hud .nm{font-size:19px}
body.practice .hud .inf{font-size:14px;color:#E9ECF3}

.tools{display:flex;gap:6px;align-items:center;padding:7px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;white-space:nowrap;flex:none}
.tb.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
body.practice .tools{display:none}

.play-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;flex:none}
.play svg{width:22px;height:22px}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pinfo b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo span{font-size:12px;color:var(--muted)}
.pbar{height:4px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;width:0;background:var(--accent)}

.scenes{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel2);border-top:1px solid var(--line);scroll-snap-type:x proximity}
.sc{flex:none;width:118px;border:1.5px solid var(--line);border-radius:11px;background:var(--panel);padding:5px;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative;scroll-snap-align:start}
.sc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sc .th{height:52px;border-radius:7px;overflow:hidden;background:var(--floor)}
.sc .th svg{width:100%;height:100%;display:block}
.sc .t1{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:22px}
.sc .t2{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .more{position:absolute;right:3px;bottom:22px;width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:16px;line-height:1}
.sc.add{justify-content:center;align-items:center;border-style:dashed;color:var(--accent);font-weight:700;font-size:15px;min-height:96px}
body.practice .sc.add{display:none}

/* stage svg */
.floor{fill:var(--floor)}.wing{fill:var(--wing)}
.g1{stroke:var(--floor-g1);stroke-width:.015}.g2{stroke:var(--floor-g2);stroke-width:.02}
.cl{stroke:var(--tape);stroke-width:.04;stroke-dasharray:.25 .12}.fe{stroke:var(--tape2);stroke-width:.05}
.st-num{fill:var(--floor-text);font-family:var(--f-num);font-size:.26px;text-anchor:middle;dominant-baseline:central}
.st-lbl{fill:var(--floor-text);font-size:.3px;text-anchor:middle;dominant-baseline:central}
.st-aud{fill:var(--tape);font-size:.32px;font-weight:700;text-anchor:middle;dominant-baseline:central;letter-spacing:.3px}
.dancer .body{stroke:rgba(0,0,0,.35);stroke-width:.03}
.dancer .halo{fill:none;stroke:transparent;stroke-width:.06}
.dancer.sel .halo{stroke:#FFFFFF;stroke-dasharray:.12 .08}
.dancer.me .halo{stroke:var(--tape);stroke-width:.1;stroke-dasharray:none}
.dancer.dim{opacity:.3}
.dancer .lbl{font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dancer .nm{fill:#D9DDE7;font-size:.22px;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:.05px}
.hide-names .dancer .nm{display:none}
.path{fill:none;stroke-width:.045;stroke-dasharray:.14 .1;opacity:.6}
.ghost{fill:none;stroke-width:.03;stroke-dasharray:.08 .06;opacity:.45}
#marq{fill:rgba(115,144,255,.15);stroke:#93A9FF;stroke-width:.03}
.prop{cursor:move}
.prop .pb{stroke:rgba(0,0,0,.35);stroke-width:.03}
.prop.sel .pb{stroke:#FFFFFF;stroke-width:.05;stroke-dasharray:.12 .08}
.prop text{text-anchor:middle;dominant-baseline:central;pointer-events:none;font-weight:700}
.rh{fill:#FFFFFF;stroke:#14161C;stroke-width:.03;cursor:nwse-resize}
body.practice .prop{cursor:default}
.ptypes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ptypes .btn{flex-direction:column;padding:12px 4px;font-size:12.5px;white-space:normal;text-align:center}
.ptypes svg{width:44px;height:30px}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(10,12,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet-card{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:16px}}
.sheet-card h2{margin:0;font-size:18px}
.sheet-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.tin{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 10px;min-width:0;width:100%;color:var(--ink)}
.tin:focus{border-color:var(--accent);outline:none}
textarea.tin{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px}
.list li.on{border-color:var(--accent)}
.list .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list .grow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .grow span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 13px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--accent)}
.sw{width:30px;height:30px;border:0;padding:0;background:none;border-radius:50%;flex:none;cursor:pointer}
.sw::-webkit-color-swatch-wrapper{padding:0}
.sw::-webkit-color-swatch{border:1px solid rgba(0,0,0,.2);border-radius:50%}
.sw::-moz-color-swatch{border:1px solid rgba(0,0,0,.2);border-radius:50%}
.mini{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 8px;font-size:13px;flex:none}
.mini:hover{background:var(--panel2);color:var(--ink)}
.mini.warn{color:var(--danger);font-weight:700}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.pth{aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);padding:0;display:grid;place-items:center;font-size:12px;color:var(--muted);cursor:pointer}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth.add{border-style:dashed;color:var(--accent)}
.big{width:100%;max-height:62vh;object-fit:contain;border-radius:9px;background:var(--panel2)}
.note-box{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:12px;font-size:14px;line-height:1.7}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .btn{justify-content:flex-start;padding:12px 14px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.recbar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.recbar span{display:block;height:100%;width:0;background:var(--accent)}
.hint{color:var(--muted);font-size:12px;line-height:1.6;margin:0}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
input,select,textarea{font-size:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ib" data-act="works" aria-label="保存した作品"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lb">作品</span></span></button>
    <input id="pname" class="pname" aria-label="作品名">
    <button class="ib" id="bUndo" data-act="undo" aria-label="戻る" disabled><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg><span class="lb">戻る</span></span></button>
    <button class="btn sm" data-act="practice" id="bPractice">練習</button>
    <button class="btn sm primary" data-act="send">送る</button>
    <button class="ib" data-act="menu" aria-label="その他"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>
  <main class="stage-area">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="hud">
      <span class="nm" id="hName"></span>
      <span class="inf" id="hInfo"></span>
      <button class="btn sm" data-act="sceneInfo" id="hMemo" hidden>メモ・写真</button>
      <button class="btn sm exitp" data-act="practice">練習をやめる</button>
    </div>
  </main>
  <div class="tools">
    <button class="tb" data-act="selAll" id="bSelAll">全員を選ぶ</button>
    <button class="tb" data-arr="row">横一列</button>
    <button class="tb" data-arr="col">縦一列</button>
    <button class="tb" data-arr="grid">格子</button>
    <button class="tb" data-act="addProp">＋ 道具</button>
    <button class="tb" data-act="sceneEdit">📝 メモ・写真</button>
    <button class="tb" data-act="dancers">👥 ダンサー</button>
    <button class="tb" data-act="sounds">♪ 音源</button>
    <button class="tb" data-act="stage">🎭 舞台</button>
  </div>
  <div class="play-bar">
    <button class="ib" data-act="prev" aria-label="前のシーン"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 6l-6 6 6 6"/></svg></button>
    <button class="play" id="bPlay" data-act="play" aria-label="再生"></button>
    <button class="ib" data-act="next" aria-label="次のシーン"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 6l6 6-6 6"/></svg></button>
    <div class="pinfo"><b id="pTitle"></b><span id="pSub"></span><div class="pbar"><i id="pFill"></i></div></div>
  </div>
  <div class="scenes" id="scenes"></div>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fOpen" hidden>
<input type="file" id="fSound" accept="audio/*,.mp3,.m4a,.wav,.aac" multiple hidden>
<input type="file" id="fPhoto" accept="image/*" multiple hidden>

<script>
(() => {
'use strict';
// ================= utilities =================
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = v => Math.round(v * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtS = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = Math.floor(t - m * 60); return m + ':' + String(s).padStart(2, '0'); };
const PALETTE = ['#E8505B', '#F59E0B', '#22B07D', '#3B82F6', '#8B5CF6', '#EC4899', '#14B8A6', '#F97316', '#84CC16', '#06B6D4', '#B07CF5', '#EAB308', '#F43F5E', '#60A5FA', '#A3E635', '#FB923C'];
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function inkFor(hex) { const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#15171C' : '#FFFFFF'; }
const short = name => [...String(name || '?').trim()].slice(0, 3).join('');
const lblSize = name => { const n = [...short(name)].length; return n <= 1 ? .34 : n === 2 ? .27 : .2; };
const baseName = n => String(n || '音源').replace(/\.[a-z0-9]{2,5}$/i, '');
let toastTimer;
function toast(msg, ms = 2600) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, ms); }
function openSheet(html, bind) { $('#card').innerHTML = html; $('#sheet').hidden = false; if (bind) bind($('#card')); }
function closeSheet() { $('#sheet').hidden = true; $('#card').innerHTML = ''; stopPreview(); }
$('#sheet').addEventListener('pointerdown', e => { if (e.target.id === 'sheet') closeSheet(); });

// blobs (sounds and photos) live in IndexedDB
const IDB = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => { const r = indexedDB.open('bamiri2', 1); r.onupgradeneeded = () => r.result.createObjectStore('blobs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return this._db;
  },
  async get(k) { try { const d = await this.open(); return await new Promise(res => { const q = d.transaction('blobs').objectStore('blobs').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async put(k, v) { try { const d = await this.open(); await new Promise(res => { const tx = d.transaction('blobs', 'readwrite'); tx.objectStore('blobs').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {} },
  async del(k) { try { const d = await this.open(); await new Promise(res => { const tx = d.transaction('blobs', 'readwrite'); tx.objectStore('blobs').delete(k); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {} }
};

// ================= state & model =================
let P = null;
const S = {
  cur: 0, sel: new Set(), playing: false, t: 0, dur: 0, practice: false, me: null, undo: [],
  pref: Object.assign({ flip: false, names: true, snap: true, propOnly: true }, ls.get('bm2.pref', {})),
  buf: {}, src: null, drag: null, dEls: {}, photoUrls: {}, saveTimer: null
};
const savePref = () => ls.set('bm2.pref', S.pref);
const NO_SOUND_LEN = 8;
const soundOf = sc => sc && sc.soundId ? P.sounds.find(s => s.id === sc.soundId) || null : null;
function sceneDur(sc) {
  if (sc.dur > 0) return sc.dur;
  const s = soundOf(sc); return s ? s.duration : NO_SOUND_LEN;
}
const moveTime = () => P.move || 1.5;
const posIn = (sc, id) => (sc && sc.pos[id]) || [0, P.stage.d / 2];
function clampPos(p, st) { st = st || P.stage; const bx = st.w / 2 + 1.4; return [r2(clamp(p[0], -bx, bx)), r2(clamp(p[1], 0, st.d))]; }
function gridPoints(n, d) {
  const cols = Math.max(1, Math.ceil(Math.sqrt(n * 1.8))), rows = Math.ceil(n / cols), pts = [];
  for (let i = 0; i < n; i++) { const r = Math.floor(i / cols), c = i % cols, cnt = r === rows - 1 ? n - r * cols : cols; pts.push([(c - (cnt - 1) / 2) * 1.2, d / 2 - (rows - 1) * 0.6 + r * 1.2]); }
  return pts;
}
function newProject(name, n) {
  const dancers = [];
  for (let i = 0; i < n; i++) dancers.push({ id: uid(), name: String(i + 1), color: PALETTE[i % PALETTE.length] });
  const stage = { w: 10, d: 7, shape: 'rect', grid: 0.5 }, pts = gridPoints(n, stage.d), pos = {};

function goScene(i) {

// ================= playback: each scene plays its sound from the top and cuts at the scene end =================
let AC = null, MASTER = null;
function ac() {
  if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.connect(AC.destination); }
  return AC;
}
async function bufferFor(soundId) {
  if (!soundId) return null;
  if (S.buf[soundId]) return S.buf[soundId];
  const blob = await IDB.get('s:' + soundId); if (!blob) return null;
  try { const ab = await blob.arrayBuffer(); const b = await new Promise((res, rej) => { const pr = ac().decodeAudioData(ab, res, rej); if (pr && pr.then) pr.then(res, rej); }); S.buf[soundId] = b; return b; } catch (e) { return null; }
}
function setPlayIcon() {
  $('#bPlay').innerHTML = S.playing ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  $('#bPlay').setAttribute('aria-label', S.playing ? '止める' : '再生');
}
function stopSrc() { if (S.src) { try { S.src.stop(); } catch (e) {} S.src.disconnect(); S.src = null; } }
async function play(from) {
  if (S.playing) { stop(); return; }
  const a = ac(); if (a.state === 'suspended') await a.resume();
  stopPreview();
  const i0 = from == null ? S.cur : from;
  const missing = [];
  await Promise.all(P.scenes.slice(i0).map(async sc => { if (sc.soundId && !(await bufferFor(sc.soundId))) missing.push(sc.name); }));
  if (missing.length) toast('音源が見つからないシーンがあります（音なしで進みます）');
  S.sel.clear(); S.playing = true; setPlayIcon();
  startScene(i0); tick();
}
function startScene(i) {
  stopSrc(); S.cur = i; const sc = P.scenes[i];
  S.dur = sceneDur(sc); S.t = 0; S.t0 = AC.currentTime;
  const buf = sc.soundId && S.buf[sc.soundId];
  if (buf) { const src = AC.createBufferSource(); src.buffer = buf; src.connect(MASTER); src.start(); S.src = src; }
  renderScenes(); renderFrame();
}
function tick() {
  if (!S.playing) return;
  S.t = AC.currentTime - S.t0;
  if (S.t >= S.dur) {
    if (S.cur + 1 < P.scenes.length) startScene(S.cur + 1);
    else { stop(true); return; }
  } else renderFrame();
  setTimeout(tick, 16);
}
function stop(ended) {
  if (!S.playing) return;
  S.playing = false; stopSrc(); S.t = 0; setPlayIcon();

  if (ended && S.onEnd) S.onEnd();
}

function stopPreview() { if (preview) { try { preview.stop(); } catch (e) {} preview = null; document.querySelectorAll('[data-act="preview"]').forEach(b => b.textContent = '▶'); } }

function guessMime(name) { const ext = (name.split('.').pop() || '').toLowerCase(); return { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', ogg: 'audio/ogg', webm: 'audio/webm' }[ext] || 'audio/mpeg'; }

    if (!buf) { toast(`「${file.name}」は読み込めませんでした（mp3・m4a・wav を試してください）`, 4000); continue; }
    await IDB.put('s:' + id, blob); S.buf[id] = buf;

  }

async function shrinkImage(file) {
  let src = null;
  try { src = await createImageBitmap(file); } catch (e) { src = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = URL.createObjectURL(file); }); }
  if (!src) return null;
  const k = Math.min(1, 1600 / Math.max(src.width, src.height)), cv = document.createElement('canvas');
  cv.width = Math.round(src.width * k); cv.height = Math.round(src.height * k);

  return await new Promise(res => cv.toBlob(res, 'image/jpeg', .85));
}

function oldIdbGet(k) {
  return new Promise(res => {
    try {
      const r = indexedDB.open('bamiri');
      r.onsuccess = () => { const db = r.result; if (!db.objectStoreNames.contains('audio')) { db.close(); return res(null); } const q = db.transaction('audio').objectStore('audio').get(k); q.onsuccess = () => { db.close(); res(q.result || null); }; q.onerror = () => { db.close(); res(null); }; };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}

  let n = 0;
  for (const o of olds) {

      if (!forms.length) continue;
      const st = o.stage || {};

      for (let i = 0; i < forms.length; i++) {
        const f = forms[i], photos = [];
        for (const ph of f.photos || []) { const rec = ph.key && await oldIdbGet(ph.key); if (rec && rec.blob) { const id = uid(); await IDB.put('p:' + id, rec.blob); photos.push({ id }); } }
        const len = forms[i + 1] ? forms[i + 1].start - f.start : f.hold;
        p.scenes.push({ id: uid(), name: f.name || `シーン${i + 1}`, soundId: null, dur: r2(Math.max(0.5, len || 4)), note: f.note || '', photos, pos: f.pos || {}, ppos: {} });
      }
      if (o.audio && o.audio.key) {
        const rec = await oldIdbGet(o.audio.key);
        if (rec && rec.blob) { const id = uid(); await IDB.put('s:' + id, rec.blob); p.sounds.push({ id, name: baseName(o.audio.name), duration: r2(o.audio.duration || 0), mime: rec.mime || o.audio.mime || '' }); }
      }
      Store.save(migrate(p)); n++;
    } catch (e) {}
  }
  ls.set('bm2.migrated', true);
  return n;
}
(async function boot() {
  const moved = await importOldWorks();
  let p = Store.get(ls.get('bm2.last', '')) || Store.list()[0];
  if (!p) { p = newProject('新しい作品', 8); Store.save(p); }
  openProject(p);
  if (moved) toast(`前のバージョンで作った作品を${moved}件引き継ぎました。左上の「☰ 作品」から開けます`, 6000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
